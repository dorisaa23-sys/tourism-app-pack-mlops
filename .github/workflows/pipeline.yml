name: Tourism Project Pipeline

on:
  push:
    branches:
      - main  # Automatically triggers on push to the main branch
  workflow_dispatch:  # lets you click "Run workflow" in the Actions tab

permissions:
  contents: write

jobs:
# ---------- JOB 1: Register Dataset ----------
  register-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: pip install -r tourism_project/requirements.txt   # Path to project's requirements file.
      - name: Register Dataset
        run: python tourism_project/model_building/data_register.py   # Path to dataset registration script.
      - name: Upload Registered Dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data/tourism.csv   # Path to the raw dataset inside data folder.
  # ---------- JOB 2: Data Preparation ----------
  data-prep:
    needs: register-dataset                      # waits for Job 1 to finish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: pip install -r tourism_project/requirements.txt   # Path to project's requirements file.
      - name: Run Data Preparation
        run: python tourism_project/model_building/prep.py     # Path to data preparation script.
      - name: Upload Train Test Splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            Xtrain.csv
            Xtest.csv
            ytrain.csv
            ytest.csv
  # ---------- JOB 3: Model Training + MLflow Tracking ----------
  model-traning:
    needs: data-prep                 # waits for Job 2 to finish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: pip install -r tourism_project/requirements.txt   # Path to project's requirements file.
      - name: Download Train Test Splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits                                    # brings Xtrain/Xtest/ytrain/ytest from Job 2
      - name: Start MLflow Server
        run: |
          nohup mlflow ui --host 0.0.0.0 --port 5000 &  # Run MLflow UI in the background
          sleep 5                                       # Wait for a moment to let the server start
      - name: Model Building
        run: python tourism_project/model_building/train.py   # Path to model training script.
      - name: Commit Trained Model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tourism_project/deployment/best_tourism_package_model_v1.joblib   # Path to your deployment folder.
          git commit -m "Add trained model [skip ci]" || echo "No changes to commit"
          git push
